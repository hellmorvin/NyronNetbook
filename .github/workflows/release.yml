name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Build Windows Desktop Release
        run: npm run build:desktop:win

      - name: Build Android Release APK
        continue-on-error: true
        run: npm run build:apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 'НейроноБлокнот v1.0.0 — Официальный Релиз / NeyroNetbook Grand Release 🧠'
          body: |
            ## 🧠 NeyroNetbook v1.0.0 Official Release
            
            Ваш персональный цифровой мозг, интерактивный нейро-граф знаний, умный планировщик смен и финансовый менеджер.
            
            ### 📦 Файлы для скачивания:
            - **NeyroNetbook-1.0.0.exe** — Windows 10/11 x64 Portable
            - **NeyroNetbook.apk** — Android 8.0 - 15+ Release Signed APK
            - **NeyroNetbook-1.0.0-win.zip** — Windows ZIP Archive
          files: |
            release/*.exe
            release/*.apk
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
