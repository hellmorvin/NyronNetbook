name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build Shared & Desktop
        run: |
          npm run build:shared
          npm run build:desktop

      - name: Package Windows Portable & Zip
        run: npm run build:desktop:win

      - name: Verify Release Directory
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Recurse | Select-Object Name, Length

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 'НейроноБлокнот v1.0.0 — Официальный Релиз / NeyroNetbook Grand Release 🧠'
          body: |
            ## 🧠 NeyroNetbook v1.0.0 Official Release
            
            Ваш персональный цифровой мозг, интерактивный нейро-граф знаний, умный планировщик смен и финансовый менеджер.
            
            ### 📦 Файлы для скачивания:
            - **NeyroNetbook-1.0.0.exe** — Windows 10/11 x64 Portable
            - **NeyroNetbook.apk** — Android 8.0 - 15+ Release Signed APK
            - **NeyroNetbook-1.0.0-win.zip** — Windows ZIP Archive
          files: |
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
